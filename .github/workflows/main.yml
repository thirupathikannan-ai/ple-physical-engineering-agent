
name: PLE Environment Preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          echo "=== DOCKER VERSION ==="
          docker --version
          echo ""
          echo "=== DOCKER STATUS ==="
          docker info

      - name: Check required credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_PROXY_URL: ${{ secrets.MODEL_PROXY_URL }}
          MODEL_PROXY_KEY: ${{ secrets.MODEL_PROXY_KEY }}
        run: |
          python - <<'PY'
          import os

          names = [
              "HF_TOKEN",
              "MODEL_PROXY_URL",
              "MODEL_PROXY_KEY",
          ]

          print("=== CREDENTIAL AVAILABILITY ===")

          for name in names:
              status = "CONFIGURED" if os.environ.get(name) else "NOT CONFIGURED"
              print(f"{name}: {status}")
          PY
