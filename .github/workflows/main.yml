
name: PLE Environment Preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker info

      - name: Install uv and Harbor
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          uv --version
          uv tool install harbor==0.20.0 --with websockets
          uv tool run --from harbor==0.20.0 harbor --version

      - name: Check credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_PROXY_URL: ${{ secrets.MODEL_PROXY_URL }}
          MODEL_PROXY_KEY: ${{ secrets.MODEL_PROXY_KEY }}
        run: |
          python - <<'PY'
          import os

          for name in [
              "HF_TOKEN",
              "MODEL_PROXY_URL",
              "MODEL_PROXY_KEY"
          ]:
              print(
                  f"{name}: "
                  f"{'CONFIGURED' if os.environ.get(name) else 'NOT CONFIGURED'}"
              )
          PY
